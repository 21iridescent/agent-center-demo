<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建智能体 — 选择模板 · Demo</title>
<script src="prototype-tokens.js"></script>
<style>
  .container {
    max-width: var(--container-grid);
    margin: 0 auto;
    padding: 32px 32px 80px;
  }

  /* ====== 类型 Tab ====== */
  .type-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }
  .type-tab {
    padding: 10px 28px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--color-border);
    background: var(--color-bg-card);
    font-size: var(--font-base);
    font-weight: 500;
    color: var(--color-text-4);
    cursor: pointer;
    transition: all 0.15s;
  }
  .type-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .type-tab.active[data-tab="dialogue"] {
    background: var(--color-primary); border-color: var(--color-primary); color: #fff;
  }
  .type-tab.active[data-tab="debate"] {
    background: var(--color-debate); border-color: var(--color-debate); color: #fff;
  }
  .type-tab.active[data-tab="discussion"] {
    background: var(--color-discussion); border-color: var(--color-discussion); color: #fff;
  }

  /* ====== 页面标题区 ====== */
  .page-header {
    margin-bottom: 28px;
  }
  .page-header h1 {
    font-size: var(--font-2xl);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .page-header p {
    font-size: var(--font-base);
    color: var(--color-text-4);
  }

  /* ====== 模板网格 ====== */
  .template-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  /* ====== 模板卡片（通用）====== */
  .tpl-card {
    background: var(--color-bg-card);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-xl);
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .tpl-card:hover {
    border-color: var(--color-primary);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px var(--color-primary-shadow);
  }
  .tpl-card.debate:hover { border-color: var(--color-debate); box-shadow: 0 8px 20px rgba(245,59,59,0.10); }
  .tpl-card.discussion:hover { border-color: var(--color-discussion); box-shadow: 0 8px 20px rgba(0,169,249,0.10); }

  .tpl-card.blank {
    border-style: dashed;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    background: var(--color-bg-soft);
  }
  .tpl-card.blank:hover { transform: translateY(-3px); }

  /* 头像圆形 */
  .tpl-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--color-primary-bg);
    color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .tpl-avatar.debate-color { background: var(--color-debate-bg); color: var(--color-debate); }
  .tpl-avatar.discussion-color { background: var(--color-discussion-bg); color: var(--color-discussion); }
  .tpl-avatar.emoji { font-size: 26px; font-weight: 400; }

  .tpl-name {
    font-size: var(--font-lg);
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--color-text);
  }
  .tpl-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .tpl-tag {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--color-bg-mute);
    border-radius: var(--radius-pill);
    color: var(--color-text-5);
  }
  .tpl-style {
    font-size: var(--font-sm);
    color: var(--color-primary);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .tpl-style.debate-style { color: var(--color-debate); }
  .tpl-style.discussion-style { color: var(--color-discussion); }

  .tpl-preview {
    font-size: var(--font-sm);
    color: var(--color-text-5);
    font-style: italic;
    line-height: 1.55;
    flex: 1;
    margin-bottom: 16px;
  }

  /* 辩论卡：VS 行 */
  .tpl-vs-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px;
    background: var(--color-bg-mute);
    border-radius: var(--radius-md);
  }
  .tpl-vs-side { flex: 1; }
  .tpl-vs-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-text-4);
    margin-bottom: 3px;
  }
  .tpl-vs-name {
    font-size: var(--font-sm);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .tpl-vs-role-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: var(--radius-xs);
    font-size: 11px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .tpl-vs-role-badge.ai { background: var(--color-primary-bg); color: var(--color-primary); }
  .tpl-vs-role-badge.human { background: var(--color-bg-mute); color: var(--color-text-4); border: 1px solid var(--color-border); }
  .tpl-vs-arg {
    font-size: 11px;
    color: var(--color-text-5);
    line-height: 1.4;
  }
  .tpl-vs-divider {
    display: flex;
    align-items: center;
    font-size: var(--font-base);
    font-weight: 700;
    color: var(--color-text-5);
    padding: 0 2px;
  }

  /* 讨论卡：主持行 */
  .tpl-host-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 10px 12px;
    background: var(--color-discussion-bg);
    border-radius: var(--radius-md);
  }
  .tpl-host-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--color-discussion-soft);
    color: var(--color-discussion-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .tpl-host-name { font-size: var(--font-sm); font-weight: 600; color: var(--color-discussion-dark); }
  .tpl-host-style { font-size: 11px; color: var(--color-discussion); margin-top: 1px; }

  /* 使用按钮 */
  .tpl-use-btn {
    width: 100%;
    padding: 9px;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: var(--font-sm);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: auto;
  }
  .tpl-use-btn:hover { background: var(--color-primary-dark); }
  .tpl-use-btn.debate-btn { background: var(--color-debate); }
  .tpl-use-btn.debate-btn:hover { background: var(--color-debate-dark); }
  .tpl-use-btn.discussion-btn { background: var(--color-discussion); }
  .tpl-use-btn.discussion-btn:hover { background: var(--color-discussion-dark); }

  /* 空白卡 */
  .blank-icon { font-size: 40px; margin-bottom: 12px; color: var(--color-text-5); }
  .blank-title { font-size: var(--font-base); font-weight: 600; color: var(--color-text-4); margin-bottom: 6px; }
  .blank-desc { font-size: var(--font-sm); color: var(--color-text-5); text-align: center; margin-bottom: 18px; line-height: 1.5; }
  .blank-start-btn {
    padding: 9px 28px;
    background: transparent;
    color: var(--color-primary);
    border: 1.5px solid var(--color-primary);
    border-radius: var(--radius-sm);
    font-size: var(--font-sm);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .blank-start-btn:hover { background: var(--color-primary-bg); }
  .blank-start-btn.debate-blank { color: var(--color-debate); border-color: var(--color-debate); }
  .blank-start-btn.debate-blank:hover { background: var(--color-debate-bg); }
  .blank-start-btn.discussion-blank { color: var(--color-discussion); border-color: var(--color-discussion); }
  .blank-start-btn.discussion-blank:hover { background: var(--color-discussion-bg); }

  /* Tab 面板切换 */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>

  <div class="tab-panel active" id="tab-dialogue">

  </div>

  <!-- Tab: 辩论 -->
  <div class="tab-panel" id="tab-debate">

  </div>

  <!-- Tab: 讨论 -->
  <div class="tab-panel" id="tab-discussion">
    <div class="template-grid" id="grid-discussion"></div>
  </div>

</main>

// ===== 渲染模板卡片 =====
function renderDialogueCard(tpl) {
  return `
    <div class="tpl-card" data-type="dialogue" data-id="${tpl.id}">
      <div class="tpl-avatar">${tpl.avatar}</div>
      <div class="tpl-name">${tpl.name}</div>
      <div class="tpl-meta">
        <span class="tpl-tag">${tpl.grade}</span>
        <span class="tpl-tag">${tpl.subject}</span>
      </div>
      <div class="tpl-style">${tpl.style}</div>
      <div class="tpl-preview">${tpl.preview}</div>
      <button class="tpl-use-btn">用此模板创建</button>
    </div>`;
}

function renderDebateCard(tpl) {
  const proRoleBadge = tpl.proRole === 'ai'
    ? '<span class="tpl-vs-role-badge ai">AI</span>'
    : '<span class="tpl-vs-role-badge human">真人</span>';
  const conRoleBadge = tpl.conRole === 'ai'
    ? '<span class="tpl-vs-role-badge ai">AI</span>'
    : '<span class="tpl-vs-role-badge human">真人</span>';
  return `
    <div class="tpl-card debate" data-type="debate" data-id="${tpl.id}">
      <div class="tpl-avatar debate-color emoji">${tpl.emoji}</div>
      <div class="tpl-name">${tpl.name}</div>
      <div class="tpl-meta">
        <span class="tpl-tag">${tpl.grade}</span>
        <span class="tpl-tag">${tpl.subject}</span>
      </div>
      <div class="tpl-preview" style="font-style:normal;font-size:12px;color:var(--color-text-4);margin-bottom:10px;">${tpl.topic}</div>
      <div class="tpl-vs-row">
        <div class="tpl-vs-side">
          <div class="tpl-vs-label">正方</div>
          ${proRoleBadge}
          <div class="tpl-vs-name">${tpl.proName}</div>
          <div class="tpl-vs-arg">${tpl.proArg}</div>
        </div>
        <div class="tpl-vs-divider">VS</div>
        <div class="tpl-vs-side">
          <div class="tpl-vs-label">反方</div>
          ${conRoleBadge}
          <div class="tpl-vs-name">${tpl.conName}</div>
          <div class="tpl-vs-arg">${tpl.conArg}</div>
        </div>
      </div>
      <button class="tpl-use-btn debate-btn">用此模板创建</button>
    </div>`;
}

function renderDiscussionCard(tpl) {
  return `
    <div class="tpl-card discussion" data-type="discussion" data-id="${tpl.id}">
      <div class="tpl-avatar discussion-color emoji">${tpl.emoji}</div>
      <div class="tpl-name">${tpl.name}</div>
      <div class="tpl-meta">
        <span class="tpl-tag">${tpl.grade}</span>
        <span class="tpl-tag">${tpl.subject}</span>
      </div>
      <div class="tpl-host-row">
        <div class="tpl-host-avatar">${tpl.hostAvatar}</div>
        <div>
          <div class="tpl-host-name">主持：${tpl.hostName}</div>
          <div class="tpl-host-style">${tpl.hostStyle}</div>
        </div>
      </div>
      <div class="tpl-preview">${tpl.preview}</div>
      <button class="tpl-use-btn discussion-btn">用此模板创建</button>
    </div>`;
}

function renderBlankCard(type) {
  const btnClass = type === 'debate' ? 'debate-blank' : type === 'discussion' ? 'discussion-blank' : '';
  return `
    <div class="tpl-card blank" data-type="${type}" data-id="blank">
      <div class="blank-icon">＋</div>
      <div class="blank-title">从空白开始</div>
      <div class="blank-desc">完全自定义，<br>不使用任何预设</div>
      <button class="blank-start-btn ${btnClass}">开始创建</button>
    </div>`;
}

// 填充网格
document.getElementById('grid-dialogue').innerHTML =
  TEMPLATES.dialogue.map(renderDialogueCard).join('') + renderBlankCard('dialogue');
document.getElementById('grid-debate').innerHTML =
  TEMPLATES.debate.map(renderDebateCard).join('') + renderBlankCard('debate');
document.getElementById('grid-discussion').innerHTML =
  TEMPLATES.discussion.map(renderDiscussionCard).join('') + renderBlankCard('discussion');

// ===== Tab 切换 =====
document.querySelectorAll('.type-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ===== 路由：点击模板卡片 =====
const TARGET_PAGES = {
  dialogue:   'AI学问创建-v0.1.html',
  debate:     'AI思辨创建-辩论-v0.1.html',
  discussion: 'AI思辨创建-讨论-v0.1.html'
};

document.querySelectorAll('.tpl-card').forEach(card => {
  card.addEventListener('click', () => {
    const type = card.dataset.type;
    const id   = card.dataset.id;
    const page = TARGET_PAGES[type];
    if (id === 'blank') {
      window.location.href = page;
    } else {
      window.location.href = `${page}?template=${encodeURIComponent(id)}`;
    }
  });
});
</script>
